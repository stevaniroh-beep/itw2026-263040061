<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #e0f7ff, #f5f5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quote-wrapper {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 100px;
            text-align: center;
            font-family: 'Pacifico', cursive;
            text-shadow: 5px 10px 5px lightblue;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: navy;
            margin: 0 0 20px;
        }

        .quote {
            font-size: 27px;
            white-space: nowrap;
            width: 400px;
            background-color: green;
            color: white;
            overflow: auto;
            padding: 20px;
            border-radius: 12px;
            margin: 0 auto;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .credit {
            font-size: 18px;
            color: navy;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="quote-wrapper">
        <h1>Galau</h1>
        <p class="quote">
            Aku mencoba menjadi kuat,<br>
            Tapi hati masih menunggu nama mu.<br>
            Di malam yang sepi,<br>
            Aku belajar menerima luka,<br>
            Tanpa pernah benar-benar melupakannya.
        </p>
        <div class="credit">~ Penulis: Sang Hati</div>
    </div>
</body>
</html>
