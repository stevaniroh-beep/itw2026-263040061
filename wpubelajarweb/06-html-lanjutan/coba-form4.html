<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>

<body>

 <h1>Contoh elemen-elemen form pada HTML</h1>

 <form>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label for="angka">Angka:</label>
    <input type="number" id="angka" name="angka">
    <br><br>

    <label for="tanggal">Tanggal:</label>
    <input type="date" id="tanggal" name="tanggal">
    <br><br>

    <label for="warna">Pilih warna:</label>
    <input type="color" id="warna" name="warna">
    <br><br>

    <label>Radio:</label>
    <input type="radio" id="radio-1" name="pilihan_radio" value="radio-1">
    <label for="radio-1">Radio 1</label>
    <input type="radio" id="radio-2" name="pilihan_radio" value="radio-2">
    <label for="radio-2">Radio 2</label>
    <br><br>

    <input type="checkbox" id="checkbox" name="checkbox" value="dipilih">
    <label for="checkbox">Checkbox</label>
    <br><br>

    <label for="combobox">Combobox:</label>
    <select id="combobox" name="combobox">
        <option value="">Pilih salah satu</option>
        <option value="pilihan-1">Pilihan 1</option>
        <option value="pilihan-2">Pilihan 2</option>
    </select>
    <br><br>

    <label for="textarea">Textarea:</label>
    <br>
    <textarea id="textarea" name="textarea" rows="4" cols="40"></textarea>
    <br><br>

    <button type="submit">Kirim</button>
 </form>
</body>
</html>
