<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, checkbox & radio</title>
</head>
<body>
 <h1>Contoh Input Atribut, checkbox &amp; radio</h1>

 <form>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukan nama" autocomplete="off">

    <h3>Hobby</h3>
    <input type="checkbox" id="hobby-olahraga" name="hobby" value="olahraga">
    <label for="hobby-olahraga">Olahraga</label>

    <h3>Jenis Kelamin</h3>
    <input type="radio" id="jenis-kelamin-pria" name="jenis_kelamin" value="pria">
    <label for="jenis-kelamin-pria">Pria</label>
    <input type="radio" id="jenis-kelamin-wanita" name="jenis_kelamin" value="wanita">
    <label for="jenis-kelamin-wanita">Wanita</label>

    <p><button type="button">Submit</button></p>
 </form>
</body>
</html>
