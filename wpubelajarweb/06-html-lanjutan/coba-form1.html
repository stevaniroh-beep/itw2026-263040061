<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>

<body>

 <h1>Contoh elemen-elemen form pada HTML</h1>

 <form>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label for="angka">Angka:</label>
    <input type="number" id="angka" name="angka">
    <br><br>

    <label for="tanggal">Tanggal:</label>
    <input type="date" id="tanggal" name="tanggal">
    <br><br>

    <label for="warna">Pilih warna:</label>
    <input type="color" id="warna" name="warna">
    <br><br>

    <button type="submit">Kirim</button>
 </form>
</body>
</html>
